<!-- Maskable app icon: full-bleed background (Android crops it to whatever
     shape the launcher uses) with the tree held inside the 80% safe circle,
     so no launcher mask can clip it. The rounded-corner version is
     favicon.svg — do not use that one as maskable, its corners get eaten. -->
